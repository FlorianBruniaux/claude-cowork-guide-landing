name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GUIDE_COMMIT: d0fc8f0cae0951b4bf4acaf1bcfef536e5fa3a1c

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout audited guide revision
        run: |
          git init ../claude-cowork-guide
          git -C ../claude-cowork-guide remote add origin https://github.com/FlorianBruniaux/claude-cowork-guide.git
          git -C ../claude-cowork-guide fetch --depth 1 origin "$GUIDE_COMMIT"
          git -C ../claude-cowork-guide checkout --detach FETCH_HEAD

      - name: Verify guide revision
        run: test "$(git -C ../claude-cowork-guide rev-parse HEAD)" = "$GUIDE_COMMIT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SEO contracts
        run: pnpm test

      - name: Check Astro project
        run: pnpm check

      - name: Build site with guide content
        run: pnpm build

      - name: Check built SEO
        run: pnpm check:built-seo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
